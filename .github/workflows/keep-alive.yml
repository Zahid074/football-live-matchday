name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes, all day, every day
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # allows manual trigger from GitHub Actions tab for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf -o /dev/null -w "Ping response code: %{http_code}\n" "${{ secrets.RENDER_BACKEND_URL }}" || echo "Ping failed (server may be waking up) — this is normal on the first ping after a long idle period."
