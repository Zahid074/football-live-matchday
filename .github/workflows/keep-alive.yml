name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health endpoint
        env:
          URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          curl -s -o /dev/null --max-time 60 --retry 2 --retry-delay 10 \
            -w "Ping response code: %{http_code}\n" "$URL" \
            || echo "Ping failed (server may be waking up)"
